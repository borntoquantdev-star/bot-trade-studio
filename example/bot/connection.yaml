# ขั้นที่ 4 — ผลจาก /bot:connect
data:
  provider: binance
  type: websocket
  history_source: binance_klines
  history_from: "2019-01-01"
  quality_checks:
    - no_gaps
    - no_zero_volume_bars
    - timezone_normalized_utc

broker:
  name: binance
  mode: testnet                 # เริ่มที่ testnet เสมอ
  order_type: limit             # ไม่ใช้ market
  idempotency: client_order_id
  reconcile_every_seconds: 30

secrets:
  source: env
  required_keys:
    - BINANCE_API_KEY
    - BINANCE_API_SECRET
  key_permissions_required:
    - read
    - spot_trade
  key_permissions_forbidden:
    - withdraw                  # ← ข้อนี้ผู้ใช้ต้องไปยืนยันด้วยตาตัวเองในหน้า Binance
